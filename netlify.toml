# Netlify Build Configuration
[build]
  publish = "build"
  command = "yarn build"
  functions = "netlify/functions"

# Preview-only client routes. Production intentionally has no matching value,
# so the router never mounts these shortcuts on the live site.
[context.deploy-preview.environment]
  REACT_APP_ENABLE_DEVELOPMENT_PREVIEWS = "true"

[context.branch-deploy.environment]
  REACT_APP_ENABLE_DEVELOPMENT_PREVIEWS = "true"

[context.staging.environment]
  REACT_APP_ENABLE_DEVELOPMENT_PREVIEWS = "true"

# CRA already emits optimized hashed assets. Avoid Netlify post-processing so
# dynamic import chunks deploy exactly as the build generated them.
[build.processing]
  skip_processing = true

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Headers for caching and compression
[[headers]]
  for = "/*"
  [headers.values]
    # Enable gzip/brotli compression (handled automatically by Netlify CDN)
    # Security headers
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"

# Root JavaScript and CSS files are not assumed to be content hashed.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"

# Revalidate browser copies so Netlify Dev's stable bundle names cannot go stale.
# Production's content-hashed assets retain long-lived caching at the CDN edge.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=31536000, immutable"

# Keep this rule after the general JavaScript rule so update checks always revalidate.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images for 1 year
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML and SPA routes: always revalidate so new deploys are picked up quickly.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"

# All redirects live in public/_redirects (success pages, Vale root, SPA fallback).
